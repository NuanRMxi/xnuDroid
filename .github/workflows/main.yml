
name: Build XNU for xnuDroid

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout upstream xnulinux
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/xnulinux
          ref: main
          path: xnulinux

      - name: Verify upstream source
        run: |
          cd xnulinux
          echo "===== SOURCE REVISION ====="
          git log -1 --format='%H %s'
          echo "===== REBUILD SCRIPT ====="
          sed -n '1,100p' scripts/vm-xnu-rebuild.sh

      - name: Build XNU
        run: |
          cd xnulinux
          bash scripts/vm-xnu-build.sh

      - name: Verify outputs
        run: |
          set -eux
          test -s "$HOME/w/dvm/out/k27/kernel-k27.macho"
          file "$HOME/w/dvm/out/k27/kernel-k27.macho"
          ls -lh "$HOME/w/dvm/out/k27/kernel-k27.macho"

          test -s "$HOME/w/dvm/out/k27/kc-k27.bin"
          file "$HOME/w/dvm/out/k27/kc-k27.bin"
          ls -lh "$HOME/w/dvm/out/k27/kc-k27.bin"

      - name: Upload XNU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xnudroid-macos-kernel
          path: |
            /home/runner/w/dvm/out/k27/kernel-k27.macho
            /home/runner/w/dvm/out/k27/kc-k27.bin
          if-no-files-found: error
          compression-level: 0
