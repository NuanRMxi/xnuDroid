
name: XNU kernel build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout upstream xnulinux
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/xnulinux
          ref: main
          path: xnulinux

      - name: Verify repository
        run: |
          cd xnulinux
          echo "COMMIT:"
          git rev-parse HEAD
          echo "SCRIPT:"
          realpath scripts/vm-xnu-build.sh
          echo "BUILD REFERENCES:"
          grep -nE 'x12377|k27|build-native-kext' \
            scripts/vm-xnu-build.sh scripts/vm-xnu-rebuild.sh || true

      - name: Build XNU
        run: |
          cd xnulinux
          bash scripts/vm-xnu-build.sh

      - name: Locate generated kernel
        run: |
          find "$HOME/w/dvm/out" \
            -type f \( -name '*.macho' -o -name 'kc-*.bin' \) \
            -printf '%p %s bytes\n'

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: xnudroid-kernel
          path: |
            /home/runner/w/dvm/out/**/*.macho
            /home/runner/w/dvm/out/**/*.bin
          if-no-files-found: warn
          compression-level: 0
