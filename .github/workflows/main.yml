
name: Build XNU kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout upstream xnulinux
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/xnulinux
          ref: main
          path: xnulinux

      - name: Verify source revision
        run: |
          cd xnulinux
          git log -1 --format='%H %s'
          grep -n 'DEVELOPMENT_ARM64_BCM2837' \
            scripts/vm-xnu-rebuild.sh || true

      - name: Build XNU and Kernel Collection
        run: |
          cd xnulinux
          bash scripts/vm-xnu-build.sh

      - name: Verify outputs
        run: |
          ls -lh ~/w/dvm/out/k27/kernel-k27.macho
          file ~/w/dvm/out/k27/kernel-k27.macho
          ls -lh ~/w/dvm/out/k27/kc-k27.bin

      - name: Upload kernel and collection
        uses: actions/upload-artifact@v4
        with:
          name: xnudroid-kernel
          path: |
            /home/runner/w/dvm/out/k27/kernel-k27.macho
            /home/runner/w/dvm/out/k27/kc-k27.bin
          if-no-files-found: error
          compression-level: 0
